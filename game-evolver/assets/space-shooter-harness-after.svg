<svg xmlns="http://www.w3.org/2000/svg" width="400" height="190" viewBox="0 55 400 170" role="img" aria-label="Space Shooter evolved harness flowchart">
<rect width="400" height="300" fill="#f7f3ec"/>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2a7f76"/>
  </marker>
</defs>

<!-- top row -->
<line x1="130" y1="95" x2="145" y2="95" stroke="#2a7f76" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="255" y1="95" x2="270" y2="95" stroke="#2a7f76" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="325" y1="103" x2="95" y2="179" stroke="#2a7f76" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.95"/>

<!-- bottom row -->
<line x1="130" y1="199" x2="145" y2="199" stroke="#2a7f76" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="255" y1="199" x2="270" y2="199" stroke="#2a7f76" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 325 193 C 360 193, 360 124, 325 124" fill="none" stroke="#2a7f76" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.95"/>

<rect x="15" y="75" width="110" height="28" rx="8" fill="#eef7f5" stroke="#2f3437" stroke-width="1.3"/>
<text x="70" y="92" text-anchor="middle" font-size="8.7" font-weight="600" fill="#2f3437">Task Spec Anchor</text>

<rect x="145" y="75" width="110" height="28" rx="8" fill="#eef7f5" stroke="#2f3437" stroke-width="1.3"/>
<text x="200" y="92" text-anchor="middle" font-size="8.7" font-weight="600" fill="#2f3437">Recent Failures</text>

<rect x="275" y="75" width="110" height="28" rx="8" fill="#eef7f5" stroke="#2f3437" stroke-width="1.3"/>
<text x="330" y="92" text-anchor="middle" font-size="8.7" font-weight="600" fill="#2f3437">Probe Digest</text>

<rect x="15" y="179" width="110" height="28" rx="8" fill="#eef7f5" stroke="#2f3437" stroke-width="1.3"/>
<text x="70" y="196" text-anchor="middle" font-size="8.7" font-weight="600" fill="#2f3437">Plan + Regression</text>

<rect x="145" y="179" width="110" height="28" rx="8" fill="#eef7f5" stroke="#2f3437" stroke-width="1.3"/>
<text x="200" y="196" text-anchor="middle" font-size="8.7" font-weight="600" fill="#2f3437">Screenshot Probe</text>

<rect x="275" y="179" width="110" height="28" rx="8" fill="#eef7f5" stroke="#2f3437" stroke-width="1.3"/>
<text x="330" y="196" text-anchor="middle" font-size="8.7" font-weight="600" fill="#2f3437">Repair + Replay</text>

</svg>
